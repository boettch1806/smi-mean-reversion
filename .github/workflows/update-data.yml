name: Kursdaten aktualisieren

on:
  schedule:
    # 22:17 UTC an Handelstagen: nach Handelsschluss der SIX (17:30 Ortszeit)
    # und ausserhalb der Minute 0, in der GitHub die meisten Jobs einplant.
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Kennzahlen neu berechnen
        run: python scripts/update_data.py

      - name: Änderungen übernehmen
        run: |
          if git diff --quiet -- data.js data/mean_reversion.csv; then
            echo "Keine Datenänderung, kein Commit."
            exit 0
          fi
          asof=$(python -c "import json,re;d=json.loads(re.search(r'window\.DATA\s*=\s*(\{.*\})\s*;',open('data.js',encoding='utf-8').read(),re.S).group(1));print(d['meta']['asof'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/mean_reversion.csv
          git commit -m "Kursdaten per ${asof}"
          git push
