name: Kursdaten aktualisieren

on:
  schedule:
    # 22:17 UTC an Handelstagen: nach Handelsschluss der SIX (17:30 Ortszeit)
    # und ausserhalb der Minute 0, in der GitHub die meisten Jobs einplant.
    - cron: '17 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kennzahlen neu berechnen und einchecken. Bei einem reinen Push entfällt der
  # Schritt, dann wird nur die bereits eingecheckte Datenlage veröffentlicht.
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Kennzahlen neu berechnen
        run: python scripts/update_data.py

      - name: Änderungen übernehmen
        run: |
          if git diff --quiet -- data.js data/mean_reversion.csv; then
            echo "Keine Datenänderung, kein Commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          asof=$(python -c "import json,re;d=json.loads(re.search(r'window\.DATA\s*=\s*(\{.*\})\s*;',open('data.js',encoding='utf-8').read(),re.S).group(1));print(d['meta']['asof'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/mean_reversion.csv
          git commit -m "Kursdaten per ${asof}"
          git push

  # Die Seite wird in jedem Lauf neu veröffentlicht. Das ist nötig, weil ein
  # Push mit dem Actions-Token keinen weiteren Workflow auslöst und der
  # Pages-Neubau sonst ausbliebe.
  deploy:
    needs: [update]
    if: always() && needs.update.result != 'failure' && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: pages
        uses: actions/deploy-pages@v4
